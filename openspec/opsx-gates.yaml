# Agent-independent validation manifest. Ordering is intentional: deterministic
# gates fail closed before authenticated/costly live tiers.
gates:
  - id: typecheck
    run: if [ "$OPSX_CHANGE" = "deterministic-prompt-submission" ]; then zig build test; else npm run typecheck; fi
    required: true

  - id: unit
    run: if [ "$OPSX_CHANGE" = "deterministic-prompt-submission" ]; then zig build test-integration; else npm run test:unit; fi
    required: true

  - id: build
    run: if [ "$OPSX_CHANGE" = "deterministic-prompt-submission" ]; then zig build -Doptimize=ReleaseSafe; else npm run build; fi
    required: true

  - id: strict-current-change
    run: openspec validate "$OPSX_CHANGE" --strict
    required: true

  # Costly gates below run only for this driver change. Missing Claude binary,
  # auth, direct-version floor, or required scenario setup must fail, not skip.
  - id: authenticated-driver-integration
    run: if [ "$OPSX_CHANGE" = "add-claude-print-driver" ]; then npm run test:integration:drivers; else true; fi
    required: true

  - id: dual-driver-scenarios
    run: if [ "$OPSX_CHANGE" = "add-claude-print-driver" ]; then npm run test:scenarios:drivers; elif [ "$OPSX_CHANGE" = "deterministic-prompt-submission" ]; then true; else ./scripts/run-scenario-s32-claude-peek.sh; fi
    required: true
