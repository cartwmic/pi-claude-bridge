# Per-scenario overrides for run-all-scenarios.sh
#
# Format: <scenario-name>|<timeout-seconds>|<model-id>
#   - scenario-name matches the basename minus run-scenario- prefix and .sh suffix
#   - either field may be `-` to keep the suite default
#   - blank lines and lines starting with `#` are ignored
#
# Defaults (set in run-all-scenarios.sh / scenario-lib.sh):
#   timeout: SCENARIO_TIMEOUT (default 300s)
#   model:   SCENARIO_MODEL   (default claude-bridge/claude-haiku-4-5)
#
# Why each entry exists:
#   s5  — steer-mid-stream relies on the model being slow enough that the
#         user's Escape lands while content is still streaming. Haiku finishes
#         a "long essay" prompt too fast → no mid-stream interrupt → coherence
#         assertion fails. Opus reliably produces multi-second streaming.
#   s13 — three rapid-fire user messages expecting ≥2 onAbort events. Haiku
#         can complete each turn before the next message arrives. Opus is slow
#         enough that the abort cascade actually lands.
#   s20 — bash-tool invocation must fire so the abort window opens. Haiku
#         occasionally narrates "I'd run sleep 60" instead of calling the
#         tool. Opus follows tool-use instructions more reliably.
#   s22-investigate — already opus internally (S22_MODEL=opus-4-7), but the
#         essay-generation subagent step routinely runs 2–3 minutes; default
#         300s is enough but we pin it explicitly so a tighter SCENARIO_TIMEOUT
#         override at the suite level doesn't kill it.
#   s28-timeout-held-round / s29-timeout-driver-death — depend on a REAL bash
#         tool round actually firing (the held round is the whole point); haiku
#         sometimes narrates instead of invoking → pin opus. s29 runs a 25s held
#         bash + an 18s --timeout + a recovery turn, so it needs headroom.

s5|-|claude-bridge/claude-opus-4-7
s13|-|claude-bridge/claude-opus-4-7
s20|-|claude-bridge/claude-opus-4-7
s22-investigate|300|-
s28-timeout-held-round|120|claude-bridge/claude-opus-4-7
s29-timeout-driver-death|180|claude-bridge/claude-opus-4-7
#   s31 — regression guard for Claude/Ink paste-collapse at 801+ byte first prompts; opus improves exact sentinel compliance.
s31-large-cold-start-prompt|240|claude-bridge/claude-opus-4-8

